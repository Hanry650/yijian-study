<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>一建复习工具</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 上传界面 -->
        <div id="upload-screen" class="screen active">
            <h1>一级建造师复习工具</h1>
            <div class="upload-area">
                <input type="file" id="file-input" accept=".xlsx,.xls" hidden>
                <label for="file-input" class="upload-btn">
                    <span class="icon">📁</span>
                    <span>点击上传Excel题库</span>
                    <small>支持 .xlsx, .xls 格式</small>
                </label>
                <div id="file-name"></div>
            </div>
            <div class="sync-area" style="background: #fff; border-radius: 12px; padding: 25px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
                <h3 style="margin-bottom: 15px; color: #4a5568; font-size: 16px;">☁️ 云端同步（自动跨设备）</h3>
                <div id="cloud-auth-area">
                    <div id="cloud-login-form" style="display: flex; flex-direction: column; gap: 10px;">
                        <input type="email" id="cloud-email" placeholder="邮箱" class="custom-count-input" style="margin-top: 0;">
                        <input type="password" id="cloud-password" placeholder="密码" class="custom-count-input" style="margin-top: 0;">
                        <div style="display: flex; gap: 10px;">
                            <button id="cloud-login-btn" class="primary-btn" style="flex: 1;">登录</button>
                            <button id="cloud-register-btn" class="secondary-btn" style="flex: 1;">注册</button>
                        </div>
                    </div>
                    <div id="cloud-user-area" class="hidden" style="text-align: center;">
                        <p id="cloud-user-email" style="color: #4a5568; margin-bottom: 15px; font-size: 14px;"></p>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <button id="cloud-upload-btn" class="primary-btn" style="flex: 1; min-width: 100px;">☁️ 上传云端</button>
                            <button id="cloud-download-btn" class="secondary-btn" style="flex: 1; min-width: 100px;">📥 下载云端</button>
                            <button id="cloud-logout-btn" class="text-btn" style="min-width: 80px;">退出</button>
                        </div>
                        <p id="cloud-last-sync" style="margin-top: 10px; font-size: 12px; color: #a0aec0;"></p>
                    </div>
                </div>
                <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 15px 0;">
                <h4 style="margin-bottom: 10px; color: #718096; font-size: 14px;">📦 本地文件导出/导入</h4>
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button id="export-btn" class="secondary-btn" style="flex: 1; min-width: 120px;">导出数据</button>
                    <label for="import-file" class="secondary-btn" style="flex: 1; min-width: 120px; text-align: center; cursor: pointer; display: inline-block;">导入数据</label>
                    <input type="file" id="import-file" accept=".json" hidden>
                </div>
            </div>
            <div class="template-info">
                <h3>Excel格式要求：</h3>
                <table>
                    <tr><th>章节</th><th>题目</th><th>答案</th></tr>
                    <tr><td>第一章</td><td>建设工程项目管理的内涵是？</td><td>自项目开始至项目完成，通过项目策划和项目控制...</td></tr>
                </table>
            </div>
            <div class="home-actions" id="home-actions" style="margin-top: 25px; display: none;">
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button id="home-start-btn" class="primary-btn" style="flex: 1; min-width: 120px;">✏️ 开始复习</button>
                    <button id="home-study-btn" class="primary-btn" style="flex: 1; min-width: 120px; background: #48bb78;">📖 学习模式</button>
                    <button id="home-question-bank-btn" class="secondary-btn" style="flex: 1; min-width: 120px;">📋 题库</button>
                    <button id="home-wrong-bank-btn" class="secondary-btn" style="flex: 1; min-width: 120px;">📚 错题本</button>
                    <button id="home-marked-bank-btn" class="secondary-btn" style="flex: 1; min-width: 120px;">⭐ 标记题目</button>
                </div>
            </div>
        </div>

        <!-- 配置界面 -->
        <div id="config-screen" class="screen">
            <h2>选择出题方式</h2>
            <div class="config-options">
                <div class="option-group">
                    <label style="display:flex;justify-content:space-between;align-items:center;">
                        <span>出题范围：<span id="chapter-selected-count" style="font-weight:400;color:#718096;font-size:14px;"></span></span>
                        <button id="chapter-sort-btn" class="text-btn" style="font-size:13px;padding:4px 10px;">🔃 倒序</button>
                    </label>
                    <div id="chapter-checkboxes" class="checkbox-group" style="display:flex;flex-direction:column;gap:0;max-height:250px;overflow-y:auto;padding:10px;border:2px solid #e2e8f0;border-radius:8px;background:#fff;">
                        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:400;margin-bottom:0;padding:6px 12px;border-radius:6px;background:#f7fafc;transition:background 0.2s;"><input type="checkbox" value="all" checked style="width:18px;height:18px;accent-color:#4299e1;"> 全部章节</label>
                    </div>
                </div>
                <div class="option-group">
                    <label>出题顺序：</label>
                    <div class="radio-group">
                        <label><input type="radio" name="order" value="random" checked> 随机</label>
                        <label><input type="radio" name="order" value="sequential"> 顺序</label>
                    </div>
                </div>
                <div class="option-group">
                    <label>题目类型：</label>
                    <div class="radio-group">
                        <label><input type="radio" name="type" value="all" checked> 全部</label>
                        <label><input type="radio" name="type" value="wrong"> 仅错题</label>
                    </div>
                </div>
                <div class="option-group">
                    <label>出题数量：</label>
                    <div class="radio-group">
                        <label><input type="radio" name="count" value="all" checked> 全部</label>
                        <label><input type="radio" name="count" value="20"> 20题</label>
                        <label><input type="radio" name="count" value="30"> 30题</label>
                        <label><input type="radio" name="count" value="custom"> 自定义</label>
                    </div>
                    <input type="number" id="custom-count" class="custom-count-input hidden" placeholder="输入题数" min="1" max="999">
                </div>
            </div>
            <div class="stats" id="stats-info"></div>
            <div class="config-actions">
                <button id="start-btn" class="primary-btn">开始复习</button>
                <button id="continue-btn" class="primary-btn hidden" style="background: #ed8936;">继续做题</button>
                <button id="study-btn" class="primary-btn" style="background: #48bb78;">学习模式</button>
                <button id="question-bank-btn" class="secondary-btn">题库列表</button>
                <button id="wrong-bank-btn" class="secondary-btn">错题库</button>
                <button id="marked-bank-btn" class="secondary-btn">⭐ 标记题目</button>
                <button id="config-export-btn" class="secondary-btn">导出数据</button>
                <button id="config-cloud-upload-btn" class="primary-btn hidden" style="background: #805ad5;">☁️ 上传云端</button>
            </div>
        </div>

        <!-- 学习模式界面 -->
        <div id="study-screen" class="screen">
            <div class="progress-bar">
                <div id="study-progress-fill"></div>
            </div>
            <div class="quiz-info">
                <span id="study-chapter-tag"></span>
                <span id="study-progress-text"></span>
            </div>
            <div class="question-card">
                <div id="study-question-text"></div>
                <div id="study-answer-area" class="study-answer">
                    <strong>答案：</strong>
                    <div id="study-answer-text"></div>
                </div>
                <div class="btn-group">
                    <button id="study-prev-btn" class="secondary-btn">上一题</button>
                    <button id="study-next-btn" class="primary-btn">下一题</button>
                </div>
            </div>
            <div class="quiz-actions">
                <button id="study-end-btn" class="text-btn">结束学习</button>
            </div>
        </div>

        <!-- 答题界面 -->
        <div id="quiz-screen" class="screen">
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div class="quiz-info">
                <span id="chapter-tag"></span>
                <span id="progress-text"></span>
            </div>
            <div class="question-card">
                <div id="question-text"></div>
                <div class="answer-area" id="free-text-area">
                    <textarea id="user-answer" placeholder="请输入你的答案..." rows="6"></textarea>
                </div>
                <div id="result-area" class="hidden">
                    <div class="result-header">
                        <span id="result-icon"></span>
                        <span id="result-text"></span>
                    </div>
                    <div class="correct-answer">
                        <strong>正确答案：</strong>
                        <div id="correct-text"></div>
                    </div>
                </div>
                <div class="btn-group">
                    <button id="submit-btn" class="primary-btn">提交答案</button>
                    <button id="retry-btn" class="primary-btn hidden">重做此题</button>
                    <button id="next-btn" class="primary-btn hidden">下一题</button>
                    <button id="show-answer-btn" class="secondary-btn">直接看答案</button>
                </div>
            </div>
            <div class="quiz-actions">
                <button id="mark-btn" class="text-btn" style="color:#ecc94b;font-weight:600;">☆ 标记本题</button>
                <button id="skip-btn" class="text-btn">跳过此题</button>
                <button id="end-btn" class="text-btn">结束复习</button>
                <button id="back-home-btn" class="text-btn">返回首页</button>
            </div>
        </div>

        <!-- 题库界面 -->
        <div id="question-bank-screen" class="screen">
            <div class="screen-header">
                <button id="back-from-question-bank" class="text-btn">← 返回</button>
                <h2>题库总览</h2>
                <span></span>
            </div>
            <div class="question-bank-toolbar">
                <div class="search-box">
                    <input type="text" id="question-bank-search" placeholder="搜索题目关键词...">
                    <button id="question-bank-search-btn">搜索</button>
                </div>
                <div class="question-bank-legend" style="display:flex;gap:15px;font-size:13px;color:#4a5568;">
                    <span><span style="display:inline-block;width:12px;height:12px;background:#c6f6d5;border-radius:2px;margin-right:4px;"></span>已做对</span>
                    <span><span style="display:inline-block;width:12px;height:12px;background:#fed7d7;border-radius:2px;margin-right:4px;"></span>错题</span>
                    <span><span style="display:inline-block;width:12px;height:12px;background:#fff;border:1px solid #e2e8f0;border-radius:2px;margin-right:4px;"></span>未做</span>
                </div>
                <div class="question-bank-toolbar-actions">
                    <button id="question-bank-edit-btn" class="secondary-btn">编辑题目状态</button>
                    <button id="question-bank-cloud-upload-btn" class="primary-btn hidden" style="background: #805ad5;">☁️ 上传云端</button>
                </div>
            </div>
            <div class="question-bank-batch-bar hidden" id="question-bank-batch-bar">
                <label class="batch-select-all">
                    <input type="checkbox" id="question-bank-select-all">
                    <span>全选</span>
                </label>
                <span id="question-bank-selected-count">已选 0 题</span>
            </div>
            <div class="question-bank-stats" id="question-bank-stats"></div>
            <div class="question-bank-list" id="question-bank-list"></div>
            <div class="question-bank-bottom-bar hidden" id="question-bank-bottom-bar">
                <button class="batch-btn done-btn" data-status="correct">已做</button>
                <button class="batch-btn wrong-btn" data-status="wrong">已错</button>
                <button class="batch-btn untouched-btn" data-status="untouched">未做</button>
                <button id="question-bank-finish-edit" class="batch-btn finish-btn">完成</button>
            </div>
        </div>

        <!-- 题库长摁菜单 -->
        <div id="question-bank-context-menu" class="modal hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
            <div class="modal-content" style="background: #fff; border-radius: 12px; padding: 25px; max-width: 280px; width: 90%; text-align: center;">
                <h3 style="margin-bottom: 15px; color: #2d3748;">题目操作</h3>
                <button id="question-bank-start-here" class="primary-btn" style="width:100%; margin-bottom:10px;">从此题开始做</button>
                <button id="question-bank-back" class="secondary-btn" style="width:100%;">返回题库界面</button>
            </div>
        </div>

        <!-- 标记题目界面 -->
        <div id="marked-bank-screen" class="screen">
            <div class="screen-header">
                <button id="back-from-marked" class="text-btn">← 返回</button>
                <h2>标记题目</h2>
                <span></span>
            </div>
            <div class="question-bank-toolbar">
                <div class="search-box">
                    <input type="text" id="marked-search" placeholder="搜索题目关键词...">
                    <button id="marked-search-btn">搜索</button>
                </div>
            </div>
            <div class="question-bank-stats" id="marked-bank-stats"></div>
            <div class="question-bank-list" id="marked-bank-list"></div>
        </div>

        <!-- 错题库界面 -->
        <div id="wrong-bank-screen" class="screen">
            <div class="screen-header">
                <button id="back-from-wrong" class="text-btn">← 返回</button>
                <h2>错题库</h2>
                <span></span>
            </div>
            <div class="wrong-bank-toolbar">
                <div class="search-box">
                    <input type="text" id="wrong-search" placeholder="搜索题目关键词...">
                    <button id="wrong-search-btn">搜索</button>
                </div>
                <div class="wrong-bank-actions">
                    <button id="export-wrong-btn" class="secondary-btn">导出错题</button>
                    <button id="batch-delete-btn" class="danger-btn hidden">批量删除</button>
                    <button id="clear-wrong-btn" class="danger-btn">清空错题</button>
                </div>
            </div>
            <div class="wrong-bank-batch-bar hidden" id="batch-bar">
                <label class="batch-select-all">
                    <input type="checkbox" id="select-all-checkbox">
                    <span>全选</span>
                </label>
                <span id="batch-selected-count">已选 0 题</span>
            </div>
            <div class="wrong-bank-stats" id="wrong-bank-stats"></div>
            <div class="wrong-bank-list" id="wrong-bank-list"></div>
        </div>

        <!-- 结果界面 -->
        <div id="result-screen" class="screen">
            <h2>复习完成</h2>
            <div class="result-stats">
                <div class="stat-item">
                    <span class="stat-num" id="total-count">0</span>
                    <span class="stat-label">总题数</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num correct" id="correct-count">0</span>
                    <span class="stat-label">正确</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num wrong" id="wrong-count">0</span>
                    <span class="stat-label">错误</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num" id="skip-count">0</span>
                    <span class="stat-label">跳过</span>
                </div>
            </div>
            <div class="wrong-list" id="wrong-list"></div>
            <div class="btn-group">
                <button id="restart-btn" class="primary-btn">再来一轮</button>
                <button id="wrong-only-btn" class="secondary-btn">只练错题</button>
                <button id="result-cloud-upload-btn" class="primary-btn hidden" style="background: #805ad5;">☁️ 上传云端</button>
            </div>
        </div>
    </div>

    <!-- 导入确认弹窗 -->
    <div id="import-modal" class="modal hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <div class="modal-content" style="background: #fff; border-radius: 12px; padding: 30px; max-width: 400px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
            <h3 style="margin-bottom: 15px; color: #2d3748;">导入数据</h3>
            <p id="import-modal-text" style="margin-bottom: 20px; color: #4a5568; line-height: 1.6;"></p>
            <div style="display: flex; gap: 10px;">
                <button id="import-overwrite-btn" class="primary-btn" style="flex: 1;">覆盖</button>
                <button id="import-merge-btn" class="secondary-btn" style="flex: 1;">合并</button>
                <button id="import-cancel-btn" class="text-btn" style="flex: 1;">取消</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
